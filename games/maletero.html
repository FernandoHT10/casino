<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maletero Secreto - Casino AC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/casino-shared.css">
    <style>
        .briefcase-wrapper {
            max-width: 900px;
            margin: 20px auto 50px;
            padding: 0 15px;
        }

        .briefcase-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            margin: 30px auto;
            perspective: 1000px;
        }

        @media (max-width: 650px) {
            .briefcase-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .case-card {
            aspect-ratio: 1.1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border-radius: 14px;
        }

        .case-card.disabled {
            pointer-events: none;
        }

        .case-card:hover:not(.opened):not(.disabled) {
            transform: translateY(-8px) scale(1.05);
        }

        .case-card.opened {
            transform: rotateY(180deg);
        }

        .case-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.15);
            user-select: none;
            padding: 10px;
        }

        .case-front {
            background: linear-gradient(145deg, #242938, #141722);
            border-color: #ffd700;
        }

        .case-front img {
            width: 58px;
            height: 50px;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        .case-front .number-label {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
        }

        .case-back {
            transform: rotateY(180deg);
            font-size: 16px;
            font-weight: 900;
            color: #fff;
            text-align: center;
        }

        .case-back img {
            width: 52px;
            height: 46px;
            margin-bottom: 4px;
        }

        .case-back.win {
            background: linear-gradient(135deg, rgba(46, 213, 115, 0.3), rgba(30, 130, 76, 0.2));
            border-color: #2ed573;
            box-shadow: 0 0 20px rgba(46, 213, 115, 0.4);
        }

        .case-back.empty {
            background: linear-gradient(135deg, rgba(255, 71, 87, 0.3), rgba(150, 45, 62, 0.2));
            border-color: #ff4757;
        }

        .result-header-text {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            min-height: 35px;
            color: var(--gold);
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="gameHeaderNav"></div>

    <div class="briefcase-wrapper">
        <div class="casino-card" style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div class="casino-chips-container" id="chipSelector" style="margin: 0;">
                    <div class="casino-chip" data-amount="50">50</div>
                    <div class="casino-chip active" data-amount="100">100</div>
                    <div class="casino-chip" data-amount="250">250</div>
                    <div class="casino-chip" data-amount="500">500</div>
                    <div class="casino-chip" data-amount="1000">1k</div>
                </div>

                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="casino-bet-input-wrap" style="margin: 0; max-width: 160px;">
                        <input type="number" id="apuesta" value="100" min="10">
                    </div>
                    <button class="casino-btn casino-btn-primary" id="startBtn">
                        <i class="fas fa-play"></i> Iniciar Ronda
                    </button>
                </div>
            </div>
        </div>

        <div class="casino-card">
            <div class="result-header-text" id="statusMsg">Selecciona tu apuesta y pulsa Iniciar Ronda</div>
            <div class="briefcase-grid" id="briefcaseGrid"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/casino-engine.js"></script>
    <script>
        casino.requireAuth();
        casino.renderHeader('gameHeaderNav', { title: 'Maletero Secreto', backUrl: '../index.html' });
        casino.setupChips('#chipSelector', '#apuesta');

        // Dificultad Real (60% riesgo de maletín vacío, 40% premios altos)
        const baseMultipliers = [0, 0, 0, 0, 0, 0, 1.2, 1.8, 2.6, 5.0];
        let currentMultipliers = [];
        let currentBet = 0;
        let isGameActive = false;

        const startBtn = document.getElementById('startBtn');
        const apuestaInput = document.getElementById('apuesta');
        const briefcaseGrid = document.getElementById('briefcaseGrid');
        const statusMsg = document.getElementById('statusMsg');

        function renderInitialBoard() {
            briefcaseGrid.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const card = document.createElement('div');
                card.className = 'case-card disabled';
                card.dataset.index = i;
                card.innerHTML = `
                    <div class="case-face case-front">
                        <img src="../assets/games/maletero/briefcase_closed.svg" alt="briefcase">
                        <span class="number-label">Maletín #${i + 1}</span>
                    </div>
                    <div class="case-face case-back">?</div>
                `;
                card.addEventListener('click', () => openBriefcase(i, card));
                briefcaseGrid.appendChild(card);
            }
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        startBtn.addEventListener('click', () => {
            if (isGameActive) return;

            const bet = parseInt(apuestaInput.value);
            if (!casino.deductBet(bet)) return;

            currentBet = bet;
            isGameActive = true;
            startBtn.disabled = true;
            apuestaInput.disabled = true;
            currentMultipliers = shuffle(baseMultipliers);

            renderInitialBoard();
            const cards = document.querySelectorAll('.case-card');
            cards.forEach(c => c.classList.remove('disabled'));

            statusMsg.innerText = '✨ 6 maletines vacíos y 4 con grandes premios. ¡Elige con cuidado!';
            casino.playSound('click');
        });

        function openBriefcase(index, cardEl) {
            if (!isGameActive) return;
            isGameActive = false;

            const cards = document.querySelectorAll('.case-card');
            cards.forEach(c => c.classList.add('disabled'));

            const mult = currentMultipliers[index];
            const backFace = cardEl.querySelector('.case-back');
            
            if (mult > 0) {
                backFace.innerHTML = `
                    <img src="../assets/games/maletero/briefcase_cash.svg">
                    <div>x${mult.toFixed(1)}</div>
                `;
                backFace.className = 'case-face case-back win';
            } else {
                backFace.innerHTML = `
                    <div style="font-size: 28px; color: #ff4757; margin-bottom: 4px;">❌</div>
                    <div>VACÍO</div>
                `;
                backFace.className = 'case-face case-back empty';
            }

            cardEl.classList.add('opened');

            const payout = Math.floor(currentBet * mult);
            setTimeout(() => {
                if (payout > 0) {
                    casino.addPayout(payout, mult, { showToast: true });
                    statusMsg.innerText = `🎉 ¡PREMIO! El maletín #${index + 1} contenía x${mult.toFixed(1)} (+${payout.toLocaleString()} créditos).`;
                    statusMsg.style.color = '#2ed573';
                } else {
                    casino.recordLoss(currentBet);
                    statusMsg.innerText = `😔 El maletín #${index + 1} estaba vacío. Suerte para la próxima.`;
                    statusMsg.style.color = '#ff4757';
                }

                cards.forEach((c, idx) => {
                    if (idx !== index) {
                        setTimeout(() => {
                            const m = currentMultipliers[idx];
                            const bf = c.querySelector('.case-back');
                            if (m > 0) {
                                bf.innerHTML = `<img src="../assets/games/maletero/briefcase_cash.svg" style="width: 35px; height: 35px;"><div>x${m.toFixed(1)}</div>`;
                                bf.className = 'case-face case-back win';
                            } else {
                                bf.innerHTML = `<div style="font-size: 20px; color: #ff4757;">❌</div><div>0x</div>`;
                                bf.className = 'case-face case-back empty';
                            }
                            c.classList.add('opened');
                            c.style.opacity = '0.5';
                        }, (idx + 1) * 90);
                    }
                });

                setTimeout(() => {
                    startBtn.disabled = false;
                    apuestaInput.disabled = false;
                    statusMsg.style.color = 'var(--gold)';
                }, 2200);
            }, 500);
        }

        renderInitialBoard();
    </script>
</body>
</html>
