<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mines Explosive - Casino AC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/casino-shared.css">
    <style>
        .mines-wrapper {
            max-width: 850px;
            margin: 20px auto 50px;
            padding: 0 15px;
        }

        .mines-dashboard {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .mines-dashboard {
                grid-template-columns: 1fr;
            }
        }

        .mines-controls-card {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .stat-badge-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }

        .stat-badge-val {
            font-weight: 800;
            color: var(--gold);
        }

        .mines-board-panel {
            background: rgba(14, 16, 24, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1;
        }

        .mine-tile {
            background: linear-gradient(145deg, #252a38, #181b24);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            padding: 8px;
        }

        .mine-tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .mine-tile:hover:not(.revealed):not(.disabled) {
            transform: translateY(-3px) scale(1.05);
            border-color: var(--gold);
            background: linear-gradient(145deg, #2d3345, #1f232f);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .mine-tile.revealed.safe {
            background: linear-gradient(145deg, rgba(46, 213, 115, 0.25), rgba(32, 191, 107, 0.15));
            border-color: #2ed573;
            animation: tilePop 0.3s ease;
        }

        .mine-tile.revealed.bomb {
            background: linear-gradient(145deg, rgba(255, 71, 87, 0.35), rgba(238, 82, 83, 0.15));
            border-color: #ff4757;
            animation: tileShake 0.4s ease;
        }

        @keyframes tilePop {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes tileShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .mine-select-btn {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mine-select-btn.active {
            background: var(--primary);
            border-color: #fff;
            box-shadow: 0 0 12px rgba(255, 107, 53, 0.5);
        }
    </style>
</head>
<body>
    <div id="gameHeaderNav"></div>

    <div class="mines-wrapper">
        <div class="mines-dashboard">
            <!-- Controles de Juego -->
            <div class="mines-controls-card">
                <div>
                    <label style="font-size: 13px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 8px;">
                        MINAS EN TABLERO
                    </label>
                    <div style="display: flex; gap: 8px;" id="minesSelector">
                        <button class="mine-select-btn active" data-mines="4">4</button>
                        <button class="mine-select-btn" data-mines="8">8</button>
                        <button class="mine-select-btn" data-mines="12">12</button>
                        <button class="mine-select-btn" data-mines="16">16</button>
                    </div>
                </div>

                <div>
                    <label style="font-size: 13px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 8px;">
                        APUESTA
                    </label>
                    <div class="casino-bet-input-wrap" style="max-width: 100%;">
                        <input type="number" id="apuesta" value="250" min="10">
                    </div>
                    <div class="casino-chips-container" id="chipSelector" style="margin-top: 10px;">
                        <div class="casino-chip" data-amount="50">50</div>
                        <div class="casino-chip active" data-amount="250">250</div>
                        <div class="casino-chip" data-amount="500">500</div>
                        <div class="casino-chip" data-amount="1000">1k</div>
                    </div>
                </div>

                <!-- Estadísticas de la partida -->
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <div class="stat-badge-row">
                        <span>Gemas descubiertas</span>
                        <span class="stat-badge-val" id="gemsFound">0</span>
                    </div>
                    <div class="stat-badge-row">
                        <span>Gemas restantes</span>
                        <span class="stat-badge-val" id="gemsRemaining">21</span>
                    </div>
                    <div class="stat-badge-row">
                        <span>Multiplicador</span>
                        <span class="stat-badge-val" id="currentMultiplier">1.00x</span>
                    </div>
                </div>

                <button class="casino-btn casino-btn-primary" id="startBtn" style="width: 100%;">
                    <i class="fas fa-play"></i> Comenzar Partida
                </button>

                <button class="casino-btn casino-btn-success" id="cashoutBtn" disabled style="width: 100%;">
                    <i class="fas fa-hand-holding-usd"></i> Retirar <span id="cashoutAmount">0</span>
                </button>
            </div>

            <!-- Tablero de Minas -->
            <div class="mines-board-panel">
                <div class="mines-grid" id="minesBoard"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/casino-engine.js"></script>
    <script>
        casino.requireAuth();
        casino.renderHeader('gameHeaderNav', { title: 'Mines Explosive', backUrl: '../index.html' });
        casino.setupChips('#chipSelector', '#apuesta');

        let numMines = 4;
        let bombs = [];
        let revealedGems = 0;
        let currentBet = 0;
        let currentMultiplier = 1.0;
        let isGameActive = false;

        const startBtn = document.getElementById('startBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const apuestaInput = document.getElementById('apuesta');
        const boardDiv = document.getElementById('minesBoard');
        const gemsFoundEl = document.getElementById('gemsFound');
        const gemsRemainingEl = document.getElementById('gemsRemaining');
        const currentMultiplierEl = document.getElementById('currentMultiplier');
        const cashoutAmountEl = document.getElementById('cashoutAmount');

        // Selección de Minas
        document.querySelectorAll('.mine-select-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isGameActive) return;
                document.querySelectorAll('.mine-select-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                numMines = parseInt(btn.dataset.mines);
                resetBoardDisplay();
                casino.playSound('click');
            });
        });

        function calculateMultiplier(step, minesCount) {
            let prob = 1;
            for (let i = 0; i < step; i++) {
                prob *= (25 - minesCount - i) / (25 - i);
            }
            return Math.max(1.08, 0.95 / prob);
        }

        function resetBoardDisplay() {
            boardDiv.innerHTML = '';
            const totalGems = 25 - numMines;
            gemsFoundEl.innerText = '0';
            gemsRemainingEl.innerText = totalGems;
            currentMultiplierEl.innerText = '1.00x';
            cashoutAmountEl.innerText = '0';

            for (let i = 0; i < 25; i++) {
                const tile = document.createElement('div');
                tile.className = 'mine-tile';
                tile.dataset.index = i;
                tile.innerHTML = `<img src="../assets/games/mines/crate.svg" alt="crate">`;
                tile.addEventListener('click', () => handleTileClick(i, tile));
                boardDiv.appendChild(tile);
            }
        }

        startBtn.addEventListener('click', () => {
            if (isGameActive) return;

            const bet = parseInt(apuestaInput.value);
            if (!casino.deductBet(bet)) return;

            currentBet = bet;
            isGameActive = true;
            revealedGems = 0;
            currentMultiplier = 1.0;

            bombs = [];
            while (bombs.length < numMines) {
                const pos = Math.floor(Math.random() * 25);
                if (!bombs.includes(pos)) bombs.push(pos);
            }

            resetBoardDisplay();
            startBtn.disabled = true;
            cashoutBtn.disabled = true;
            apuestaInput.disabled = true;
            document.querySelectorAll('.mine-select-btn').forEach(b => b.style.pointerEvents = 'none');
            document.querySelectorAll('.casino-chip').forEach(c => c.style.pointerEvents = 'none');

            casino.showToast('¡Partida iniciada! Abre las cajas con cuidado.', 'info');
        });

        function handleTileClick(index, tileEl) {
            if (!isGameActive || tileEl.classList.contains('revealed')) return;

            tileEl.classList.add('revealed');

            if (bombs.includes(index)) {
                // DETONÓ UNA BOMBA
                tileEl.classList.add('bomb');
                tileEl.innerHTML = `<img src="../assets/games/mines/mine.svg" alt="mine">`;
                isGameActive = false;
                casino.playSound('explosion');
                casino.recordLoss(currentBet);

                // Revelar todas las demás minas
                document.querySelectorAll('.mine-tile').forEach((t, idx) => {
                    if (bombs.includes(idx) && idx !== index) {
                        t.classList.add('revealed', 'bomb');
                        t.innerHTML = `<img src="../assets/games/mines/mine.svg" alt="mine">`;
                    }
                });

                casino.showToast('¡Detonaste una mina! Apuesta perdida.', 'error');
                endGame();
            } else {
                // ENCONTRÓ UNA GEMA
                revealedGems++;
                tileEl.classList.add('safe');
                tileEl.innerHTML = `<img src="../assets/games/mines/gem.svg" alt="gem">`;
                casino.playSound('chip');

                currentMultiplier = calculateMultiplier(revealedGems, numMines);
                const currentProfit = Math.floor(currentBet * currentMultiplier);

                gemsFoundEl.innerText = revealedGems;
                gemsRemainingEl.innerText = (25 - numMines) - revealedGems;
                currentMultiplierEl.innerText = currentMultiplier.toFixed(2) + 'x';
                cashoutAmountEl.innerText = currentProfit.toLocaleString();

                cashoutBtn.disabled = false;

                if (revealedGems === (25 - numMines)) {
                    casino.showToast('🏆 ¡TABLERO LIMPIO! Descubriste todas las gemas.', 'win');
                    cashOut();
                }
            }
        }

        cashoutBtn.addEventListener('click', cashOut);

        function cashOut() {
            if (!isGameActive || revealedGems === 0) return;
            isGameActive = false;

            const totalPayout = Math.floor(currentBet * currentMultiplier);
            casino.addPayout(totalPayout, currentMultiplier, { showToast: true });

            document.querySelectorAll('.mine-tile').forEach((t, idx) => {
                if (!t.classList.contains('revealed')) {
                    t.classList.add('revealed');
                    const isB = bombs.includes(idx);
                    t.innerHTML = `<img src="../assets/games/mines/${isB ? 'mine.svg' : 'gem.svg'}">`;
                    t.style.opacity = '0.5';
                }
            });

            endGame();
        }

        function endGame() {
            startBtn.disabled = false;
            cashoutBtn.disabled = true;
            apuestaInput.disabled = false;
            document.querySelectorAll('.mine-select-btn').forEach(b => b.style.pointerEvents = 'auto');
            document.querySelectorAll('.casino-chip').forEach(c => c.style.pointerEvents = 'auto');
        }

        resetBoardDisplay();
    </script>
</body>
</html>
