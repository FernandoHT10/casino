<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thimbles Magic - Casino AC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/casino-shared.css">
    <style>
        .thimbles-wrapper {
            max-width: 850px;
            margin: 20px auto 50px;
            padding: 0 15px;
        }

        .thimbles-table {
            background: radial-gradient(circle at center, #2e1c14 0%, #150d09 80%);
            border: 8px solid #3d2618;
            border-radius: var(--radius-lg);
            padding: 50px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            text-align: center;
            overflow: hidden;
        }

        .cups-stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            min-height: 240px;
            margin: 30px auto;
            position: relative;
            width: 500px;
        }

        .cup-item {
            width: 100px;
            height: 140px;
            position: absolute;
            bottom: 20px;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            user-select: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .cup-item img.cup-graphic {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6));
            transition: transform 0.35s ease;
            position: relative;
            z-index: 10;
        }

        .cup-item.disabled {
            pointer-events: none;
        }

        .cup-item:hover:not(.disabled) img.cup-graphic {
            transform: translateY(-12px);
            filter: drop-shadow(0 20px 20px var(--gold-glow));
        }

        .cup-item.lifted img.cup-graphic {
            transform: translateY(-80px) !important;
        }

        /* Bolita Dorada 100% Oculta hasta el final */
        .golden-ball-img {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            z-index: 2;
            display: none;
        }

        .mode-toggle-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--gold);
            color: #111;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .shuffle-status-msg {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--gold);
            min-height: 32px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="gameHeaderNav"></div>

    <div class="thimbles-wrapper">
        <div class="casino-card" style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div class="mode-toggle-bar" style="margin: 0;">
                    <button class="mode-btn" data-cups="2">2 Vasos (1.95x)</button>
                    <button class="mode-btn active" data-cups="3">3 Vasos (2.90x)</button>
                </div>

                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="casino-bet-input-wrap" style="margin: 0; max-width: 160px;">
                        <input type="number" id="apuesta" value="100" min="10">
                    </div>
                    <button class="casino-btn casino-btn-primary" id="startBtn">
                        <i class="fas fa-play"></i> Mezclar y Jugar
                    </button>
                </div>
            </div>
            <div class="casino-chips-container" id="chipSelector" style="margin: 15px 0 0;">
                <div class="casino-chip" data-amount="50">50</div>
                <div class="casino-chip active" data-amount="100">100</div>
                <div class="casino-chip" data-amount="250">250</div>
                <div class="casino-chip" data-amount="500">500</div>
            </div>
        </div>

        <div class="thimbles-table">
            <div class="shuffle-status-msg" id="statusMsg">Selecciona tu apuesta y pulsa Mezclar</div>

            <div class="cups-stage" id="cupsStage"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/casino-engine.js"></script>
    <script>
        casino.requireAuth();
        casino.renderHeader('gameHeaderNav', { title: 'Thimbles Magic', backUrl: '../index.html' });
        casino.setupChips('#chipSelector', '#apuesta');

        let totalCups = 3;
        let winningCupId = 0; // ID del vaso que contiene la bola
        let cupPositions = [0, 1, 2]; // mapeo id -> slot visual (0, 1, 2)
        let isPlaying = false;
        let isShuffling = false;

        const startBtn = document.getElementById('startBtn');
        const apuestaInput = document.getElementById('apuesta');
        const stage = document.getElementById('cupsStage');
        const statusMsg = document.getElementById('statusMsg');

        // Alternar 2 o 3 vasos
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isPlaying) return;
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                totalCups = parseInt(btn.dataset.cups);
                initStage();
                casino.playSound('click');
            });
        });

        // Calcular posición X del slot visual
        function getSlotX(slotIndex, count) {
            const spacing = count === 2 ? 180 : 150;
            const center = stage.clientWidth / 2;
            const startX = center - ((count - 1) * spacing) / 2 - 50;
            return startX + slotIndex * spacing;
        }

        function initStage() {
            stage.innerHTML = '';
            cupPositions = [];

            for (let i = 0; i < totalCups; i++) {
                cupPositions.push(i);
                const cup = document.createElement('div');
                cup.className = 'cup-item disabled';
                cup.dataset.cupId = i;

                cup.innerHTML = `
                    <img src="../assets/games/thimbles/golden_ball.svg" class="golden-ball-img" id="ball_${i}">
                    <img src="../assets/games/thimbles/goblet.svg" class="cup-graphic">
                `;

                cup.style.left = '0px';
                cup.style.transform = `translateX(${getSlotX(i, totalCups)}px)`;
                cup.addEventListener('click', () => pickCup(i));
                stage.appendChild(cup);
            }
        }

        // Intercambiar visualmente 2 slots
        function swapSlots(slotA, slotB) {
            return new Promise(resolve => {
                // Encontrar qué vasos están en esos slots
                const cupIdA = cupPositions.findIndex(slot => slot === slotA);
                const cupIdB = cupPositions.findIndex(slot => slot === slotB);

                // Actualizar mapeo
                cupPositions[cupIdA] = slotB;
                cupPositions[cupIdB] = slotA;

                const cupElA = stage.querySelector(`[data-cup-id="${cupIdA}"]`);
                const cupElB = stage.querySelector(`[data-cup-id="${cupIdB}"]`);

                cupElA.style.transform = `translateX(${getSlotX(slotB, totalCups)}px)`;
                cupElB.style.transform = `translateX(${getSlotX(slotA, totalCups)}px)`;

                casino.playSound('chip');
                setTimeout(resolve, 380);
            });
        }

        startBtn.addEventListener('click', async () => {
            if (isPlaying) return;

            const bet = parseInt(apuestaInput.value);
            if (!casino.deductBet(bet)) return;

            isPlaying = true;
            isShuffling = true;
            startBtn.disabled = true;
            apuestaInput.disabled = true;
            document.querySelectorAll('.mode-btn').forEach(b => b.style.pointerEvents = 'none');

            initStage();
            const cups = stage.querySelectorAll('.cup-item');

            // 1. Ocultar todas las bolas
            stage.querySelectorAll('.golden-ball-img').forEach(b => b.style.display = 'none');

            // 2. Asignar vaso ganador y mostrar bola
            winningCupId = Math.floor(Math.random() * totalCups);
            const winCup = stage.querySelector(`[data-cup-id="${winningCupId}"]`);
            const winBall = document.getElementById(`ball_${winningCupId}`);

            winBall.style.display = 'block';
            winCup.classList.add('lifted');
            statusMsg.innerText = '¡Atención! Mira en qué vaso entra la bola dorada.';
            casino.playSound('card');

            await new Promise(r => setTimeout(r, 1300));

            // 3. BAJAR EL VASO Y OCULTAR 100% LA BOLA ANTES DE MEZCLAR (FIX DEL BUG)
            winCup.classList.remove('lifted');
            await new Promise(r => setTimeout(r, 400));
            winBall.style.display = 'none'; // ¡100% INVISIBLE DURANTE EL SHUFFLE!

            statusMsg.innerText = '🌪️ ¡Sigue el vaso con la vista!';

            // 4. Barajado Físico Real (Intercambio animado de posiciones)
            const numSwaps = totalCups === 2 ? 5 : 7;
            for (let s = 0; s < numSwaps; s++) {
                // Elegir dos slots distintos
                let s1 = Math.floor(Math.random() * totalCups);
                let s2 = Math.floor(Math.random() * totalCups);
                while (s2 === s1) s2 = Math.floor(Math.random() * totalCups);

                await swapSlots(s1, s2);
                await new Promise(r => setTimeout(r, 60));
            }

            // 5. Finalizar barajado y permitir elección
            isShuffling = false;
            cups.forEach(c => c.classList.remove('disabled'));
            statusMsg.innerText = '🤔 ¿En cuál de los vasos quedó la bola? ¡Elige!';
            casino.playSound('click');
        });

        function pickCup(chosenCupId) {
            if (!isPlaying || isShuffling) return;
            isPlaying = false;

            const cups = stage.querySelectorAll('.cup-item');
            cups.forEach(c => c.classList.add('disabled'));

            const chosenCupEl = stage.querySelector(`[data-cup-id="${chosenCupId}"]`);
            const winningCupEl = stage.querySelector(`[data-cup-id="${winningCupId}"]`);
            const winBall = document.getElementById(`ball_${winningCupId}`);

            // Levantar vaso elegido
            chosenCupEl.classList.add('lifted');
            winBall.style.display = 'block'; // Solo se revela ahora al finalizar

            const mult = totalCups === 3 ? 2.90 : 1.95;
            const bet = parseInt(apuestaInput.value);

            setTimeout(() => {
                if (chosenCupId === winningCupId) {
                    // Ganó
                    const payout = Math.floor(bet * mult);
                    casino.addPayout(payout, mult, { showToast: true });
                    statusMsg.innerText = `🎉 ¡EXCELENTE VISTA! Acertaste el vaso ganador (+${payout.toLocaleString()} créditos).`;
                    statusMsg.style.color = '#2ed573';
                } else {
                    // Falló: levantar también el vaso donde realmente estaba
                    winningCupEl.classList.add('lifted');
                    casino.recordLoss(bet);
                    statusMsg.innerText = `😔 ¡Fallaste! La bola estaba en el otro cubilete.`;
                    statusMsg.style.color = '#ff4757';
                }

                setTimeout(() => {
                    startBtn.disabled = false;
                    apuestaInput.disabled = false;
                    document.querySelectorAll('.mode-btn').forEach(b => b.style.pointerEvents = 'auto');
                    statusMsg.style.color = 'var(--gold)';
                }, 2200);
            }, 300);
        }

        window.addEventListener('resize', initStage);
        initStage();
    </script>
</body>
</html>
