<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko Neon - Casino AC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/casino-shared.css">
    <style>
        .plinko-wrapper {
            max-width: 800px;
            margin: 20px auto 40px;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .plinko-controls-bar {
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .canvas-card {
            background: rgba(14, 16, 24, 0.9);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            position: relative;
        }

        canvas#plinkoCanvas {
            display: block;
            border-radius: 12px;
            background: radial-gradient(circle at 50% 20%, #171b29 0%, #0a0c13 100%);
        }

        .last-multipliers-strip {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            min-height: 35px;
        }

        .mult-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            animation: badgeIn 0.3s ease;
        }

        @keyframes badgeIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="gameHeaderNav"></div>

    <div class="plinko-wrapper">
        <!-- Controles -->
        <div class="plinko-controls-bar">
            <div class="casino-chips-container" id="chipSelector" style="margin: 0;">
                <div class="casino-chip" data-amount="50">50</div>
                <div class="casino-chip active" data-amount="100">100</div>
                <div class="casino-chip" data-amount="250">250</div>
                <div class="casino-chip" data-amount="500">500</div>
            </div>

            <div style="display: flex; gap: 10px; align-items: center;">
                <div class="casino-bet-input-wrap" style="margin: 0; max-width: 160px;">
                    <input type="number" id="apuesta" value="100" min="10">
                </div>
                <button class="casino-btn casino-btn-primary" id="dropBtn">
                    <i class="fas fa-arrow-circle-down"></i> Soltar Bola
                </button>
            </div>
        </div>

        <!-- Canvas del Plinko con física y curva en campana real -->
        <div class="canvas-card">
            <canvas id="plinkoCanvas" width="600" height="520"></canvas>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">HISTORIAL:</span>
                <div class="last-multipliers-strip" id="multHistory"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabase-config.js"></script>
    <script src="../shared/casino-engine.js"></script>
    <script>
        casino.requireAuth();
        casino.renderHeader('gameHeaderNav', { title: 'Plinko Neon', backUrl: '../index.html' });
        casino.setupChips('#chipSelector', '#apuesta');

        const canvas = document.getElementById('plinkoCanvas');
        const ctx = canvas.getContext('2d');
        const dropBtn = document.getElementById('dropBtn');
        const apuestaInput = document.getElementById('apuesta');
        const multHistory = document.getElementById('multHistory');

        const ROWS = 9;
        const pegs = [];
        const balls = [];
        const particles = [];
        
        // Curva en campana auténtica de casino calibrada al 96.22% RTP (House edge 3.78%)
        // Binomial P(k) = C(9, k) / 512
        const buckets = [
            { mult: 29.0, color: '#ff4757' },
            { mult: 8.0,  color: '#ff6b35' },
            { mult: 3.0,  color: '#f7931e' },
            { mult: 1.3,  color: '#ffd700' },
            { mult: 0.5,  color: '#57606f' },
            { mult: 0.5,  color: '#57606f' },
            { mult: 1.3,  color: '#ffd700' },
            { mult: 3.0,  color: '#f7931e' },
            { mult: 8.0,  color: '#ff6b35' },
            { mult: 29.0, color: '#ff4757' }
        ];

        const startY = 60;
        const spacingY = 40;
        const spacingX = 46;

        for (let r = 0; r < ROWS; r++) {
            const count = r + 3;
            const startX = (canvas.width - (count - 1) * spacingX) / 2;
            for (let c = 0; c < count; c++) {
                pegs.push({
                    x: startX + c * spacingX,
                    y: startY + r * spacingY,
                    r: 4.5,
                    glow: 0
                });
            }
        }

        const bucketWidth = canvas.width / buckets.length;
        const bucketHeight = 40;
        const bucketY = canvas.height - bucketHeight - 10;

        function createSparkles(x, y, color) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x, y,
                    vx: (casino.randomFloat() - 0.5) * 4,
                    vy: (casino.randomFloat() - 0.5) * 4,
                    color,
                    life: 1.0
                });
            }
        }

        function updatePhysics() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Clavijas
            pegs.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, peg.r, 0, Math.PI * 2);
                ctx.fillStyle = peg.glow > 0 ? '#ffffff' : '#ffd700';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = peg.glow > 0 ? 15 : 4;
                ctx.fill();
                ctx.shadowBlur = 0;

                if (peg.glow > 0) peg.glow -= 0.05;
            });

            // Buckets
            buckets.forEach((b, i) => {
                const bx = i * bucketWidth + 3;
                const bw = bucketWidth - 6;
                ctx.fillStyle = b.color;
                ctx.globalAlpha = b.flash > 0 ? 1 : 0.85;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = b.flash > 0 ? 20 : 0;
                
                ctx.beginPath();
                ctx.roundRect(bx, bucketY, bw, bucketHeight, 6);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`x${b.mult.toFixed(1)}`, bx + bw / 2, bucketY + bucketHeight / 2);

                if (b.flash > 0) b.flash -= 0.04;
            });

            // Partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
            }
            ctx.globalAlpha = 1;

            // Bolas con guía suave Galton
            for (let i = balls.length - 1; i >= 0; i--) {
                const ball = balls[i];

                ball.vy += 0.22;
                ball.vx *= 0.98;

                // Guía hacia el contenedor binomial predeterminado
                const progress = Math.min(1.0, Math.max(0, (ball.y - startY) / (bucketY - startY)));
                const targetCurrentX = (canvas.width / 2) + (ball.targetX - canvas.width / 2) * progress;
                ball.vx += (targetCurrentX - ball.x) * 0.012;

                ball.x += ball.vx;
                ball.y += ball.vy;

                pegs.forEach(peg => {
                    const dx = ball.x - peg.x;
                    const dy = ball.y - peg.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < ball.r + peg.r) {
                        peg.glow = 1.0;
                        createSparkles(peg.x, peg.y, '#ffd700');
                        casino.playSound('chip');

                        const angle = Math.atan2(dy, dx);
                        const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) * 0.65;
                        const randAngle = angle + (casino.randomFloat() - 0.5) * 0.35;

                        ball.vx = Math.cos(randAngle) * (speed + 0.5);
                        ball.vy = Math.sin(randAngle) * (speed + 0.5);

                        ball.x = peg.x + Math.cos(angle) * (ball.r + peg.r + 1);
                        ball.y = peg.y + Math.sin(angle) * (ball.r + peg.r + 1);
                    }
                });

                if (ball.x < ball.r) {
                    ball.x = ball.r;
                    ball.vx = Math.abs(ball.vx);
                } else if (ball.x > canvas.width - ball.r) {
                    ball.x = canvas.width - ball.r;
                    ball.vx = -Math.abs(ball.vx);
                }

                // Render Bola
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
                ctx.fillStyle = '#ff6b35';
                ctx.shadowColor = '#ff6b35';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Aterrizaje Atómico
                if (ball.y >= bucketY + 8) {
                    if (ball.settled) {
                        balls.splice(i, 1);
                        continue;
                    }
                    ball.settled = true;

                    const bucket = buckets[ball.targetBucket];
                    bucket.flash = 1.0;

                    // Liquidación idempotente de la ronda asociada a esta bola
                    casino.settleRound(ball.roundId, bucket.mult, { showToast: true });

                    const badge = document.createElement('div');
                    badge.className = 'mult-badge';
                    badge.style.background = bucket.color;
                    badge.innerText = `x${bucket.mult.toFixed(1)}`;
                    multHistory.prepend(badge);
                    if (multHistory.children.length > 6) {
                        multHistory.lastElementChild.remove();
                    }

                    balls.splice(i, 1);
                }
            }

            requestAnimationFrame(updatePhysics);
        }

        dropBtn.addEventListener('click', () => {
            // Ronda independiente por bola con clave única
            const round = casino.startRound('plinko_' + Date.now() + '_' + casino.randomInt(1000, 9999), apuestaInput.value, { allowConcurrent: true });
            if (!round) return;

            // Galton de 9 filas: suma binomial de 9 decisiones (0 o 1) con p = 0.5
            let targetBucket = 0;
            for (let r = 0; r < 9; r++) {
                targetBucket += casino.randomInt(0, 1);
            }
            targetBucket = Math.max(0, Math.min(buckets.length - 1, targetBucket));
            const targetX = targetBucket * bucketWidth + bucketWidth / 2;

            balls.push({
                roundId: round.roundId,
                bet: round.betAmount,
                settled: false,
                targetBucket,
                targetX,
                x: canvas.width / 2 + (casino.randomFloat() - 0.5) * 8,
                y: 20,
                vx: (casino.randomFloat() - 0.5) * 1.2,
                vy: 0.6,
                r: 8.5
            });
        });

        updatePhysics();
    </script>
</body>
</html>
