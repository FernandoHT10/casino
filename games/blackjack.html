<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Royal - Casino AC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/casino-shared.css">
    <style>
        .blackjack-container {
            max-width: 900px;
            margin: 20px auto 40px;
            padding: 0 15px;
        }

        .felt-table {
            background: radial-gradient(circle at center, #0e5a2b 0%, #083c1b 70%, #042410 100%);
            border: 12px solid #2a1b10;
            border-radius: 40px;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.6);
            padding: 35px 25px;
            position: relative;
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .table-branding {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: rgba(255, 215, 0, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .hand-section {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 15px 20px;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .hand-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .cards-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            min-height: 105px;
            align-items: center;
        }

        .playing-card {
            width: 72px;
            height: 104px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            color: #111;
            font-weight: 900;
            font-size: 14px;
            position: relative;
            user-select: none;
            animation: dealCard 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #ddd;
        }

        @keyframes dealCard {
            from { transform: translateY(-40px) scale(0.6); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .playing-card.red {
            color: #d63031;
        }

        .playing-card .card-center-suit {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .playing-card .card-center-suit img {
            width: 30px;
            height: 30px;
        }

        .playing-card.card-back {
            background: repeating-linear-gradient(
                45deg,
                #1a2a6c,
                #1a2a6c 8px,
                #b21f1f 8px,
                #b21f1f 16px
            );
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .playing-card.card-back img {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        .score-pill {
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: 800;
        }

        .game-controls-panel {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .result-banner {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 900;
            padding: 12px;
            border-radius: 12px;
            margin: 10px 0;
            display: none;
            animation: bannerPop 0.4s ease-out;
        }

        @keyframes bannerPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .result-banner.win {
            background: rgba(46, 213, 115, 0.25);
            border: 2px solid #2ed573;
            color: #2ed573;
        }

        .result-banner.lose {
            background: rgba(255, 71, 87, 0.25);
            border: 2px solid #ff4757;
            color: #ff4757;
        }

        .result-banner.push {
            background: rgba(255, 215, 0, 0.25);
            border: 2px solid #ffd700;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div id="gameHeaderNav"></div>

    <div class="blackjack-container">
        <!-- Panel de Apuestas -->
        <div class="casino-card" style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div class="casino-chips-container" id="chipSelector" style="margin: 0;">
                    <div class="casino-chip" data-amount="100">100</div>
                    <div class="casino-chip" data-amount="250">250</div>
                    <div class="casino-chip active" data-amount="500">500</div>
                    <div class="casino-chip" data-amount="1000">1k</div>
                    <div class="casino-chip" data-amount="2500">2.5k</div>
                </div>

                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="casino-bet-input-wrap" style="margin: 0;">
                        <input type="number" id="apuesta" value="500" min="10" placeholder="Apuesta">
                    </div>
                    <button class="casino-btn casino-btn-primary" id="dealBtn">
                        <i class="fas fa-play"></i> Repartir
                    </button>
                </div>
            </div>
        </div>

        <!-- Mesa de Juego Verde -->
        <div class="felt-table">
            <div class="table-branding">Blackjack paga 3 a 2 • Crupier se planta en 17</div>

            <!-- Mano del Crupier -->
            <div class="hand-section">
                <div class="hand-header">
                    <span>🎩 Crupier</span>
                    <span class="score-pill" id="dealerScore">-</span>
                </div>
                <div class="cards-row" id="dealerCards"></div>
            </div>

            <!-- Banner de Resultado -->
            <div class="result-banner" id="resultBanner"></div>

            <!-- Mano del Jugador -->
            <div class="hand-section">
                <div class="hand-header">
                    <span>👤 Tu Mano</span>
                    <span class="score-pill" id="playerScore">-</span>
                </div>
                <div class="cards-row" id="playerCards"></div>
            </div>

            <!-- Botones de Acción -->
            <div class="game-controls-panel">
                <button class="casino-btn casino-btn-success" id="hitBtn" disabled style="min-width: 140px;">
                    <i class="fas fa-plus-circle"></i> Pedir Carta
                </button>
                <button class="casino-btn casino-btn-danger" id="standBtn" disabled style="min-width: 140px;">
                    <i class="fas fa-hand-paper"></i> Plantarse
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/casino-engine.js"></script>
    <script>
        casino.requireAuth();
        casino.renderHeader('gameHeaderNav', { title: 'Blackjack Royal', backUrl: '../index.html' });
        casino.setupChips('#chipSelector', '#apuesta');

        const suits = [
            { name: 'spade', isRed: false },
            { name: 'club', isRed: false },
            { name: 'heart', isRed: true },
            { name: 'diamond', isRed: true }
        ];

        const cardRanks = [
            { label: 'A', value: 11 },
            { label: '2', value: 2 },
            { label: '3', value: 3 },
            { label: '4', value: 4 },
            { label: '5', value: 5 },
            { label: '6', value: 6 },
            { label: '7', value: 7 },
            { label: '8', value: 8 },
            { label: '9', value: 9 },
            { label: '10', value: 10 },
            { label: 'J', value: 10 },
            { label: 'Q', value: 10 },
            { label: 'K', value: 10 }
        ];

        let state = {
            deck: [],
            playerCards: [],
            dealerCards: [],
            currentBet: 0,
            isPlaying: false
        };

        const dealBtn = document.getElementById('dealBtn');
        const hitBtn = document.getElementById('hitBtn');
        const standBtn = document.getElementById('standBtn');
        const apuestaInput = document.getElementById('apuesta');
        const resultBanner = document.getElementById('resultBanner');

        function createDeck() {
            const deck = [];
            for (let s of suits) {
                for (let r of cardRanks) {
                    deck.push({ rank: r.label, val: r.value, suitName: s.name, isRed: s.isRed });
                }
            }
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function drawCard() {
            if (state.deck.length < 10) state.deck = createDeck();
            return state.deck.pop();
        }

        function calculateHand(cards) {
            let sum = 0;
            let aces = 0;
            for (let c of cards) {
                sum += c.val;
                if (c.rank === 'A') aces++;
            }
            while (sum > 21 && aces > 0) {
                sum -= 10;
                aces--;
            }
            return sum;
        }

        function renderCardEl(card, isHidden = false) {
            const el = document.createElement('div');
            el.className = 'playing-card';
            if (isHidden) {
                el.classList.add('card-back');
                el.innerHTML = `<img src="../assets/ui/crown.svg">`;
                return el;
            }
            if (card.isRed) el.classList.add('red');
            el.innerHTML = `
                <div>${card.rank}</div>
                <div class="card-center-suit">
                    <img src="../assets/games/cards/${card.suitName}.svg">
                </div>
                <div style="text-align: right; transform: rotate(180deg);">${card.rank}</div>
            `;
            return el;
        }

        function updateHandUI(hideDealerHole = true) {
            const pDiv = document.getElementById('playerCards');
            const dDiv = document.getElementById('dealerCards');
            pDiv.innerHTML = '';
            dDiv.innerHTML = '';

            state.playerCards.forEach(c => pDiv.appendChild(renderCardEl(c)));
            document.getElementById('playerScore').innerText = calculateHand(state.playerCards);

            state.dealerCards.forEach((c, idx) => {
                if (idx === 1 && hideDealerHole) {
                    dDiv.appendChild(renderCardEl(c, true));
                } else {
                    dDiv.appendChild(renderCardEl(c, false));
                }
            });

            if (hideDealerHole && state.dealerCards.length > 0) {
                document.getElementById('dealerScore').innerText = state.dealerCards[0].val;
            } else {
                document.getElementById('dealerScore').innerText = calculateHand(state.dealerCards);
            }
        }

        function showResult(msg, type) {
            resultBanner.className = `result-banner ${type}`;
            resultBanner.innerText = msg;
            resultBanner.style.display = 'block';
        }

        function resetGameControls() {
            state.isPlaying = false;
            dealBtn.disabled = false;
            apuestaInput.disabled = false;
            hitBtn.disabled = true;
            standBtn.disabled = true;
            document.querySelectorAll('.casino-chip').forEach(c => c.style.pointerEvents = 'auto');
        }

        dealBtn.addEventListener('click', () => {
            if (state.isPlaying) return;

            const betAmount = parseInt(apuestaInput.value);
            if (!casino.deductBet(betAmount)) return;

            state.currentBet = betAmount;
            state.isPlaying = true;
            dealBtn.disabled = true;
            apuestaInput.disabled = true;
            resultBanner.style.display = 'none';
            document.querySelectorAll('.casino-chip').forEach(c => c.style.pointerEvents = 'none');

            state.deck = createDeck();
            state.playerCards = [drawCard(), drawCard()];
            state.dealerCards = [drawCard(), drawCard()];

            casino.playSound('card');
            updateHandUI(true);

            const pSum = calculateHand(state.playerCards);
            const dSum = calculateHand(state.dealerCards);

            if (pSum === 21) {
                updateHandUI(false);
                if (dSum === 21) {
                    casino.addPayout(state.currentBet, 1, { showToast: true });
                    showResult('Empate de Blackjack. Se devuelve tu apuesta.', 'push');
                } else {
                    const payout = Math.floor(state.currentBet * 2.5);
                    casino.addPayout(payout, 2.5, { showToast: true });
                    showResult(`¡BLACKJACK NATURAL! Ganaste ${payout.toLocaleString()} créditos (3:2)`, 'win');
                }
                resetGameControls();
            } else {
                hitBtn.disabled = false;
                standBtn.disabled = false;
            }
        });

        hitBtn.addEventListener('click', () => {
            if (!state.isPlaying) return;
            state.playerCards.push(drawCard());
            casino.playSound('card');
            updateHandUI(true);

            const pSum = calculateHand(state.playerCards);
            if (pSum > 21) {
                updateHandUI(false);
                casino.recordLoss(state.currentBet);
                showResult(`Te pasaste con ${pSum}. Mano perdida.`, 'lose');
                resetGameControls();
            } else if (pSum === 21) {
                standHand();
            }
        });

        standBtn.addEventListener('click', standHand);

        function standHand() {
            if (!state.isPlaying) return;
            hitBtn.disabled = true;
            standBtn.disabled = true;

            updateHandUI(false);
            casino.playSound('card');

            function dealerStep() {
                const dSum = calculateHand(state.dealerCards);
                if (dSum < 17) {
                    setTimeout(() => {
                        state.dealerCards.push(drawCard());
                        casino.playSound('card');
                        updateHandUI(false);
                        dealerStep();
                    }, 500);
                } else {
                    finishRound();
                }
            }
            setTimeout(dealerStep, 400);
        }

        function finishRound() {
            const pSum = calculateHand(state.playerCards);
            const dSum = calculateHand(state.dealerCards);

            if (dSum > 21) {
                const payout = state.currentBet * 2;
                casino.addPayout(payout, 2);
                showResult(`¡El crupier se pasó (${dSum})! Ganaste ${payout.toLocaleString()} créditos`, 'win');
            } else if (pSum > dSum) {
                const payout = state.currentBet * 2;
                casino.addPayout(payout, 2);
                showResult(`¡Ganaste con ${pSum} contra ${dSum} del crupier! (+${payout.toLocaleString()})`, 'win');
            } else if (pSum === dSum) {
                casino.addPayout(state.currentBet, 1);
                showResult(`Empate a ${pSum}. Apuesta recuperada.`, 'push');
            } else {
                casino.recordLoss(state.currentBet);
                showResult(`Crupier gana con ${dSum} contra tus ${pSum}.`, 'lose');
            }

            resetGameControls();
        }
    </script>
</body>
</html>
