<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road - Casino AC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../shared/casino-shared.css">
    <style>
        .chicken-wrapper {
            max-width: 850px;
            margin: 20px auto 50px;
            padding: 0 15px;
        }

        .chicken-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .chicken-layout {
                grid-template-columns: 1fr;
            }
        }

        .highway-panel {
            background: rgba(14, 16, 24, 0.85);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .highway-road {
            height: 480px;
            background: linear-gradient(to bottom, #232733 0%, #151821 100%);
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            border: 4px solid #32384a;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        .road-lane-strip {
            position: absolute;
            left: 0;
            right: 0;
            height: 4px;
            background: repeating-linear-gradient(90deg, #ffd700, #ffd700 20px, transparent 20px, transparent 40px);
            opacity: 0.45;
        }

        #chickenContainer {
            position: absolute;
            left: calc(50% - 20px);
            bottom: 10px;
            width: 40px;
            height: 40px;
            z-index: 50;
            transition: bottom 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
            user-select: none;
        }

        #chickenContainer img {
            width: 100%;
            height: 100%;
            transition: transform 0.2s;
        }

        .car-obstacle {
            position: absolute;
            z-index: 20;
            animation: carDrive linear infinite;
        }

        .car-obstacle img {
            height: 38px;
            width: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        @keyframes carDrive {
            from { transform: translateX(-90px); }
            to { transform: translateX(540px); }
        }

        .info-stat-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-stat-val {
            font-weight: 800;
            color: var(--gold);
        }
    </style>
</head>
<body>
    <div id="gameHeaderNav"></div>

    <div class="chicken-wrapper">
        <div class="chicken-layout">
            <!-- Panel Lateral de Controles -->
            <div class="casino-card">
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px;">
                        APUESTA
                    </label>
                    <div class="casino-bet-input-wrap" style="max-width: 100%;">
                        <input type="number" id="apuesta" value="100" min="10">
                    </div>
                    <div class="casino-chips-container" id="chipSelector" style="margin-top: 10px;">
                        <div class="casino-chip" data-amount="50">50</div>
                        <div class="casino-chip active" data-amount="100">100</div>
                        <div class="casino-chip" data-amount="250">250</div>
                        <div class="casino-chip" data-amount="500">500</div>
                    </div>
                </div>

                <div class="info-stat-card">
                    <span>Carril Actual</span>
                    <span class="info-stat-val" id="laneIndex">0 / 8</span>
                </div>
                <div class="info-stat-card">
                    <span>Multiplicador</span>
                    <span class="info-stat-val" id="multVal">1.00x</span>
                </div>
                <div class="info-stat-card">
                    <span>Premio Acumulado</span>
                    <span class="info-stat-val" id="accumulatedWinnings">0</span>
                </div>
                <div class="info-stat-card">
                    <span>Riesgo de Choque</span>
                    <span class="info-stat-val" id="nextRisk" style="color: #ff4757;">16%</span>
                </div>

                <button class="casino-btn casino-btn-primary" id="startBtn" style="width: 100%; margin-bottom: 10px;">
                    <i class="fas fa-play"></i> Iniciar Cruce
                </button>

                <button class="casino-btn casino-btn-warning" id="advanceBtn" disabled style="width: 100%; margin-bottom: 10px; background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff;">
                    <i class="fas fa-forward"></i> Avanzar Carril
                </button>

                <button class="casino-btn casino-btn-success" id="cashoutBtn" disabled style="width: 100%;">
                    <i class="fas fa-hand-holding-usd"></i> Retirar Ganancias
                </button>
            </div>

            <!-- Carretera con Tráfico y Gallina Vectorial -->
            <div class="highway-panel">
                <div class="highway-road" id="road">
                    <div id="chickenContainer">
                        <img src="../assets/games/chicken/chicken.svg" id="chickenImg">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/casino-engine.js"></script>
    <script>
        casino.requireAuth();
        casino.renderHeader('gameHeaderNav', { title: 'Chicken Road', backUrl: '../index.html' });
        casino.setupChips('#chipSelector', '#apuesta');

        // Riesgo real escalado (Sin victorias regaladas)
        const multipliers = [1.20, 1.50, 2.00, 2.80, 4.00, 6.50, 11.00, 20.00];
        const riskRates =   [0.16, 0.20, 0.24, 0.29, 0.34, 0.39, 0.44, 0.50];
        const carAssets = ['car_red.svg', 'car_blue.svg', 'truck.svg'];

        let currentBet = 0;
        let currentLane = 0;
        let isGameActive = false;
        let isHopping = false;
        let trafficInterval = null;

        const startBtn = document.getElementById('startBtn');
        const advanceBtn = document.getElementById('advanceBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const apuestaInput = document.getElementById('apuesta');
        const chickenContainer = document.getElementById('chickenContainer');
        const chickenImg = document.getElementById('chickenImg');
        const road = document.getElementById('road');

        const laneIndexEl = document.getElementById('laneIndex');
        const multValEl = document.getElementById('multVal');
        const accumulatedWinningsEl = document.getElementById('accumulatedWinnings');
        const nextRiskEl = document.getElementById('nextRisk');

        function buildLanes() {
            road.innerHTML = `
                <div id="chickenContainer">
                    <img src="../assets/games/chicken/chicken.svg" id="chickenImg">
                </div>
            `;
            for (let i = 1; i <= 8; i++) {
                const strip = document.createElement('div');
                strip.className = 'road-lane-strip';
                strip.style.bottom = `${i * 54}px`;
                road.appendChild(strip);
            }
        }

        // Tráfico de vehículos más dinámico
        function startTraffic() {
            if (trafficInterval) clearInterval(trafficInterval);
            trafficInterval = setInterval(() => {
                if (!isGameActive) return;
                const car = document.createElement('div');
                car.className = 'car-obstacle';
                const asset = carAssets[Math.floor(Math.random() * carAssets.length)];
                car.innerHTML = `<img src="../assets/games/chicken/${asset}">`;
                
                const randomLane = Math.floor(Math.random() * 8) + 1;
                car.style.bottom = `${randomLane * 54 - 40}px`;
                car.style.animationDuration = `${Math.random() * 1.0 + 1.6}s`; // Más veloces
                road.appendChild(car);

                setTimeout(() => {
                    if (car.parentNode) car.remove();
                }, 3500);
            }, 500);
        }

        function updateStatsUI() {
            laneIndexEl.innerText = `${currentLane} / 8`;
            const mult = currentLane > 0 ? multipliers[currentLane - 1] : 1.0;
            multValEl.innerText = `${mult.toFixed(2)}x`;
            const win = Math.floor(currentBet * mult);
            accumulatedWinningsEl.innerText = win.toLocaleString();

            if (currentLane < 8) {
                nextRiskEl.innerText = `${Math.round(riskRates[currentLane] * 100)}%`;
            } else {
                nextRiskEl.innerText = '¡Meta lograda!';
            }
        }

        startBtn.addEventListener('click', () => {
            if (isGameActive) return;

            const bet = parseInt(apuestaInput.value);
            if (!casino.deductBet(bet)) return;

            currentBet = bet;
            currentLane = 0;
            isGameActive = true;
            isHopping = false;

            buildLanes();
            const ch = document.getElementById('chickenContainer');
            const img = document.getElementById('chickenImg');
            ch.style.bottom = '10px';
            img.src = '../assets/games/chicken/chicken.svg';
            img.style.transform = 'scale(1)';

            startBtn.disabled = true;
            advanceBtn.disabled = false;
            cashoutBtn.disabled = true;
            apuestaInput.disabled = true;

            startTraffic();
            updateStatsUI();
            casino.showToast('¡La gallina inicia su camino! Cuidado con el tráfico.', 'info');
        });

        advanceBtn.addEventListener('click', () => {
            if (!isGameActive || isHopping || currentLane >= 8) return;

            // Bloquear clics durante el salto
            isHopping = true;
            advanceBtn.disabled = true;
            cashoutBtn.disabled = true;

            const ch = document.getElementById('chickenContainer');
            const img = document.getElementById('chickenImg');
            casino.playSound('chip');

            setTimeout(() => {
                const risk = riskRates[currentLane];
                const hit = Math.random() < risk;

                if (hit) {
                    // Atropellada
                    img.src = '../assets/games/mines/mine.svg';
                    img.style.transform = 'rotate(180deg) scale(1.2)';
                    casino.playSound('explosion');
                    casino.recordLoss(currentBet);
                    casino.showToast('¡Oh no! Un vehículo chocó a la gallina. Apuesta perdida.', 'error');
                    endGame();
                } else {
                    // Cruce Exitoso
                    currentLane++;
                    ch.style.bottom = `${currentLane * 54 + 10}px`;
                    casino.playSound('card');

                    updateStatsUI();
                    isHopping = false;

                    if (currentLane >= 8) {
                        casino.showToast('🏆 ¡INCREÍBLE! Cruzaste toda la carretera sana y salva.', 'win');
                        setTimeout(cashOut, 1000);
                    } else {
                        advanceBtn.disabled = false;
                        cashoutBtn.disabled = false;
                    }
                }
            }, 550);
        });

        cashoutBtn.addEventListener('click', cashOut);

        function cashOut() {
            if (!isGameActive || currentLane === 0) return;
            isGameActive = false;

            const mult = multipliers[currentLane - 1];
            const payout = Math.floor(currentBet * mult);
            casino.addPayout(payout, mult, { showToast: true });

            endGame();
        }

        function endGame() {
            isGameActive = false;
            isHopping = false;
            if (trafficInterval) clearInterval(trafficInterval);

            startBtn.disabled = false;
            advanceBtn.disabled = true;
            cashoutBtn.disabled = true;
            apuestaInput.disabled = false;
        }

        buildLanes();
    </script>
</body>
</html>
