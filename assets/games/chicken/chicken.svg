<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="100%" height="100%">
  <defs>
    <!-- Sombras y Filtros -->
    <filter id="mascotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <radialGradient id="bodyGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f6fa"/>
      <stop offset="85%" stop-color="#dcdde1"/>
      <stop offset="100%" stop-color="#b2bec3"/>
    </radialGradient>
    <radialGradient id="wingGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e1e2e6"/>
      <stop offset="100%" stop-color="#95a5a6"/>
    </radialGradient>
    <linearGradient id="combGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3838"/>
      <stop offset="70%" stop-color="#eb3b5a"/>
      <stop offset="100%" stop-color="#b71540"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff200"/>
      <stop offset="50%" stop-color="#ff9f1a"/>
      <stop offset="100%" stop-color="#e58e26"/>
    </linearGradient>
    <linearGradient id="feetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb142"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
    <!-- Ojo 3D -->
    <radialGradient id="eyeIris" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="70%" stop-color="#1e272e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Medalla / Pajarita dorada VIP de Casino -->
    <linearGradient id="goldBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
  </defs>

  <g filter="url(#mascotShadow)">
    <!-- Sombra del piso -->
    <ellipse cx="80" cy="165" rx="42" ry="12" fill="rgba(0,0,0,0.35)"/>

    <!-- Patas naranjas 3D -->
    <g id="feet">
      <!-- Pata izquierda -->
      <path d="M58 145 L54 162 M54 162 L42 165 M54 162 L52 168 M54 162 L62 166" 
            stroke="url(#feetGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Pata derecha -->
      <path d="M102 145 L106 162 M106 162 L96 166 M106 162 L106 168 M106 162 L116 165" 
            stroke="url(#feetGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Cola plumosa trasera -->
    <g id="tail">
      <path d="M35 115 C20 100, 10 75, 25 60 C32 75, 42 85, 48 95 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
      <path d="M40 105 C25 90, 18 68, 30 50 C40 68, 48 80, 52 90 Z" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/>
      <path d="M45 110 C32 98, 28 80, 38 68 C45 80, 52 90, 56 100 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
    </g>

    <!-- Cuerpo principal regordete 3D -->
    <ellipse cx="80" cy="115" rx="48" ry="44" fill="url(#bodyGrad)" stroke="#dcdde1" stroke-width="2"/>

    <!-- Textura de plumas en pecho -->
    <path d="M68 118 Q80 126 92 118" fill="none" stroke="#dcdde1" stroke-width="3" stroke-linecap="round"/>
    <path d="M72 128 Q80 134 88 128" fill="none" stroke="#dcdde1" stroke-width="3" stroke-linecap="round"/>

    <!-- Alas 3D con volumen -->
    <!-- Ala Izquierda -->
    <path d="M34 98 C24 112, 28 135, 44 140 C52 142, 58 130, 54 115 C50 102, 42 94, 34 98 Z" 
          fill="url(#wingGrad)" stroke="#bdc3c7" stroke-width="1.5"/>
    <!-- Ala Derecha -->
    <path d="M126 98 C136 112, 132 135, 116 140 C108 142, 102 130, 106 115 C110 102, 118 94, 126 98 Z" 
          fill="url(#wingGrad)" stroke="#bdc3c7" stroke-width="1.5"/>

    <!-- Pajarita / Moño Dorado VIP del Casino en el Pecho -->
    <g id="bowtie" transform="translate(80, 94)">
      <polygon points="-14,-8 0,-2 -14,4" fill="url(#goldBow)" stroke="#d35400" stroke-width="1"/>
      <polygon points="14,-8 0,-2 14,4" fill="url(#goldBow)" stroke="#d35400" stroke-width="1"/>
      <circle cx="0" cy="-2" r="3.5" fill="#f39c12" stroke="#e67e22" stroke-width="1"/>
    </g>

    <!-- Cabeza 3D -->
    <circle cx="80" cy="62" r="32" fill="url(#bodyGrad)" stroke="#dcdde1" stroke-width="2"/>

    <!-- Cresta Roja Realista (3 bulbos) -->
    <g id="comb">
      <path d="M72 32 C68 18, 54 20, 62 34 Z" fill="url(#combGrad)"/>
      <path d="M80 30 C76 10, 64 12, 74 34 Z" fill="url(#combGrad)"/>
      <path d="M88 32 C86 16, 98 16, 92 34 Z" fill="url(#combGrad)"/>
      <path d="M70 34 C64 22, 94 20, 92 35 C92 40, 68 40, 70 34 Z" fill="url(#combGrad)" stroke="#b71540" stroke-width="1"/>
    </g>

    <!-- Mofletes sonrojados tiernos -->
    <ellipse cx="60" cy="74" rx="7" ry="4" fill="rgba(255, 107, 129, 0.45)"/>
    <ellipse cx="100" cy="74" rx="7" ry="4" fill="rgba(255, 107, 129, 0.45)"/>

    <!-- Ojos Caricatura / Pixar 3D -->
    <!-- Ojo Izquierdo -->
    <g id="leftEye">
      <ellipse cx="68" cy="58" rx="8.5" ry="11" fill="#ffffff" stroke="#2d3436" stroke-width="1.5"/>
      <ellipse cx="69" cy="58" rx="5.5" ry="7.5" fill="url(#eyeIris)"/>
      <!-- Brillos de luz en el ojo -->
      <circle cx="67" cy="54" r="2.8" fill="#ffffff"/>
      <circle cx="71" cy="61" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Ojo Derecho -->
    <g id="rightEye">
      <ellipse cx="92" cy="58" rx="8.5" ry="11" fill="#ffffff" stroke="#2d3436" stroke-width="1.5"/>
      <ellipse cx="91" cy="58" rx="5.5" ry="7.5" fill="url(#eyeIris)"/>
      <!-- Brillos de luz en el ojo -->
      <circle cx="89" cy="54" r="2.8" fill="#ffffff"/>
      <circle cx="93" cy="61" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Barbas rojas bajo el pico (Wattle) -->
    <path d="M75 78 C73 88, 77 92, 80 88 C83 92, 87 88, 85 78 Z" fill="url(#combGrad)" stroke="#b71540" stroke-width="1"/>

    <!-- Pico Amarillo 3D -->
    <g id="beak">
      <!-- Parte superior del pico -->
      <path d="M72 68 C80 66, 80 66, 88 68 C84 76, 80 82, 80 82 C80 82, 76 76, 72 68 Z" 
            fill="url(#beakGrad)" stroke="#d35400" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Fosas nasales -->
      <circle cx="76" cy="69" r="0.8" fill="#d35400"/>
      <circle cx="84" cy="69" r="0.8" fill="#d35400"/>
    </g>
  </g>
</svg>